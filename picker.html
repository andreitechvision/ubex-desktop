<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Share your screen</title>
  <style>
    :root { --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --border: #e2e8f0; --hover: #f1f5f9; --primary: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f8fafc; --muted: #94a3b8; --border: #27272a; --hover: #18181b; --primary: #3b82f6; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px 20px 8px; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 6px; padding: 8px 20px; }
    .tabs button { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .tabs button[aria-pressed="true"] { color: var(--fg); background: var(--hover); }
    main { flex: 1; overflow-y: auto; padding: 8px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
    .source { border: 2px solid var(--border); border-radius: 10px; background: none; color: inherit; padding: 6px; cursor: pointer; text-align: left; font: inherit; }
    .source:hover { background: var(--hover); }
    .source[aria-pressed="true"] { border-color: var(--primary); }
    .source img, .source .blank { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 6px; background: var(--hover); }
    .source span { display: block; margin-top: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
    footer button { border-radius: 8px; padding: 7px 16px; font: inherit; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--fg); }
    footer .share { background: var(--primary); border-color: var(--primary); color: #fff; }
    footer .share:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Share your screen</h1>
    <p>Choose a whole screen or a single window.</p>
  </header>
  <div class="tabs">
    <button type="button" data-kind="screen" aria-pressed="true">Entire screen</button>
    <button type="button" data-kind="window" aria-pressed="false">Window</button>
  </div>
  <main id="list"></main>
  <footer>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="share" class="share" disabled>Share</button>
  </footer>
  <script>
    let sources = [];
    let kind = 'screen';
    let chosen = null;
    const list = document.getElementById('list');
    const share = document.getElementById('share');

    function render() {
      list.textContent = '';
      sources.filter((s) => s.kind === kind).forEach((s) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'source';
        b.setAttribute('aria-pressed', String(chosen === s.id));
        if (s.thumbnail) {
          const img = document.createElement('img');
          img.src = s.thumbnail;
          img.alt = '';
          b.appendChild(img);
        } else {
          const blank = document.createElement('div');
          blank.className = 'blank';
          b.appendChild(blank);
        }
        const label = document.createElement('span');
        label.textContent = s.name;
        b.appendChild(label);
        b.onclick = () => { chosen = s.id; share.disabled = false; render(); };
        b.ondblclick = () => window.picker.choose(s.id);
        list.appendChild(b);
      });
    }

    document.querySelectorAll('.tabs button').forEach((t) => {
      t.onclick = () => {
        kind = t.dataset.kind;
        document.querySelectorAll('.tabs button').forEach((o) => o.setAttribute('aria-pressed', String(o === t)));
        render();
      };
    });
    document.getElementById('cancel').onclick = () => window.picker.choose(null);
    share.onclick = () => chosen && window.picker.choose(chosen);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.choose(null); });

    window.picker.sources().then((all) => {
      sources = all;
      const screens = all.filter((s) => s.kind === 'screen');
      if (screens.length === 1) { chosen = screens[0].id; share.disabled = false; }
      render();
    });
  </script>
</body>
</html>
